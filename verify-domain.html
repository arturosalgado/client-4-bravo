<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Verify Domain</title>
    <script>
        (function () {
            const getSystemTheme = () =>
                window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const selectedTheme = localStorage.getItem('selectedTheme') || 'system';
            const resolvedTheme = selectedTheme === 'system' ? getSystemTheme() : selectedTheme;
            document.documentElement.setAttribute('data-theme', resolvedTheme);
        })();
    </script>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #0284c7;
            --success: #22c55e;
            --error: #ef4444;
        }
        :root[data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .card h1 { font-size: 1.25rem; margin-bottom: 1rem; }
        .card p { color: var(--text-secondary); margin-bottom: 1rem; }
        .status { font-weight: 600; margin: 1rem 0; }
        .status.success { color: var(--success); }
        .status.error { color: var(--error); }
        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <div class="card">
        <h1>Domain Verification</h1>
        <div id="status">
            <div class="spinner" id="spinner"></div>
            <p id="message">Verifying your domain…</p>
        </div>
        <div id="result" style="display:none;">
            <p class="status success" id="success-msg"></p>
            <p class="status error" id="error-msg"></p>
            <p><a href="domain.html">← Back to domain verification</a></p>
        </div>
    </div>

    <script>
        const AUTH_API_BASE = 'http://localhost:3007/api';

        (async function () {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            const spinner = document.getElementById('spinner');
            const message = document.getElementById('message');
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');
            const successMsg = document.getElementById('success-msg');
            const errorMsg = document.getElementById('error-msg');

            if (!token) {
                spinner.style.display = 'none';
                message.textContent = 'Missing verification token.';
                resultDiv.style.display = 'block';
                errorMsg.textContent = 'Invalid or missing link. Please request a new verification email.';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${AUTH_API_BASE}/auth/v1.0/domain/confirm-verification`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token }),
                });
                const data = await res.json();

                spinner.style.display = 'none';
                statusDiv.style.display = 'none';
                resultDiv.style.display = 'block';

                if (res.ok && data.verified) {
                    successMsg.textContent = `Domain ${data.domain || ''} verified successfully!`;
                    successMsg.style.display = 'block';
                } else {
                    errorMsg.textContent = data.message || 'Verification failed. The link may have expired.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                spinner.style.display = 'none';
                statusDiv.style.display = 'none';
                resultDiv.style.display = 'block';
                errorMsg.textContent = `Error: ${err.message}. Check that the API is running at ${AUTH_API_BASE}`;
                errorMsg.style.display = 'block';
            }
        })();
    </script>
</body>

</html>
